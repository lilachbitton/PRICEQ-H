<html lang="he" dir="rtl">

    <title>Hagay Tadmor - Proposal Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Assistant', sans-serif;
      }
      h1, h2, h3, .font-serif {
        font-family: 'Frank Ruhl Libre', serif;
      }
      @media print {
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .page-break-avoid {
            page-break-inside: avoid;
        }
        tr, td, th {
            page-break-inside: avoid !important;
        }
      }
      /* Responsive Table Styles */
      @media (max-width: 767px) {
        .responsive-table thead {
          display: none;
        }
        .responsive-table > tbody > tr {
          display: block;
          margin-bottom: 1.5rem;
          border: 1px solid #e2e8f0;
          border-radius: 0.5rem;
          padding: 1rem;
          box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }
        .responsive-table td {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-top: 0.5rem;
          padding-bottom: 0.5rem;
          text-align: right !important;
        }
        .responsive-table td:not(:last-child) {
          border-bottom: 1px solid #f1f5f9;
        }
        .responsive-table td::before {
          content: attr(data-label);
          font-weight: 600;
          padding-left: 1rem;
        }
        .responsive-table td > *:last-child {
          text-align: left;
          flex-grow: 1;
          max-width: 60%;
        }
         .responsive-table td.full-width-input > *:last-child {
            max-width: 100%;
            width: 100%;
        }
        .responsive-table td.actions-cell {
          justify-content: center;
          padding-top: 1rem;
          border-bottom: none;
        }
        .responsive-table td.actions-cell::before {
          display: none;
        }
      }
    </style>
